<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06091A"/>
      <stop offset="100%" stop-color="#0A0F1E"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#00D4B8" fill-opacity="0.12"/>
    </pattern>
    <radialGradient id="glow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00D4B8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00D4B8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#dots)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <!-- abstract wafer rings -->
  <g fill="none" stroke="#00D4B8" stroke-opacity="0.08" stroke-width="1">
    <circle cx="900" cy="280" r="120"/>
    <circle cx="900" cy="280" r="80"/>
    <circle cx="900" cy="280" r="40"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <rect x="80" y="520" width="200" height="140" rx="4"/>
    <rect x="100" y="540" width="160" height="20" rx="2"/>
    <rect x="100" y="570" width="120" height="12" rx="2"/>
    <rect x="100" y="590" width="140" height="12" rx="2"/>
    <rect x="100" y="610" width="90" height="12" rx="2"/>
  </g>
  <!-- connection lines -->
  <g stroke="#00D4B8" stroke-opacity="0.12" stroke-width="1">
    <path d="M280 590 L480 400 L720 320"/>
    <circle cx="280" cy="590" r="3" fill="#00D4B8" fill-opacity="0.3"/>
    <circle cx="720" cy="320" r="3" fill="#00D4B8" fill-opacity="0.3"/>
  </g>
</svg>
