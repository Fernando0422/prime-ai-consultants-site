<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="archTitle">
  <title id="archTitle">Prime AI governed architecture: AI connects to semantic layer, then read-only approved views, not raw MES tables</title>
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4B8"/>
      <stop offset="100%" stop-color="#0d7d72"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0A0F1E" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- flow row -->
  <g filter="url(#shadow)">
    <rect x="24" y="48" width="140" height="72" rx="10" fill="#0A0F1E"/>
    <text x="94" y="78" text-anchor="middle" fill="#00D4B8" font-family="system-ui,sans-serif" font-size="15" font-weight="700">AI Layer</text>
    <text x="94" y="100" text-anchor="middle" fill="#8A8A9A" font-family="system-ui,sans-serif" font-size="13">Queries &amp; insights</text>

    <rect x="220" y="36" width="180" height="96" rx="10" fill="#0D1B3E" stroke="#00D4B8" stroke-width="2"/>
    <text x="310" y="72" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Semantic Layer</text>
    <text x="310" y="92" text-anchor="middle" fill="#00D4B8" font-family="system-ui,sans-serif" font-size="13">Business logic + rules</text>
    <text x="310" y="112" text-anchor="middle" fill="#8A8A9A" font-family="system-ui,sans-serif" font-size="12">Validated calculations</text>

    <rect x="456" y="48" width="180" height="72" rx="10" fill="#fff" stroke="#E0E0E8"/>
    <text x="546" y="78" text-anchor="middle" fill="#0A0F1E" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Approved Views</text>
    <text x="546" y="100" text-anchor="middle" fill="#0d7d72" font-family="system-ui,sans-serif" font-size="13">Read-only access</text>
  </g>
  <!-- arrows -->
  <g stroke="url(#tealGrad)" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M164 84 L218 84"/>
    <path d="M400 84 L454 84"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#00D4B8"/>
    </marker>
  </defs>
  <!-- blocked path -->
  <rect x="24" y="168" width="612" height="120" rx="12" fill="#F5F5F7" stroke="#E0E0E8"/>
  <text x="330" y="198" text-anchor="middle" fill="#5a5a6e" font-family="system-ui,sans-serif" font-size="16" font-weight="600">Operational database (MES / ERP / custom)</text>
  <g fill="#fff" stroke="#E0E0E8" stroke-width="1">
    <rect x="48" y="214" width="72" height="36" rx="4"/><rect x="132" y="214" width="72" height="36" rx="4"/>
    <rect x="216" y="214" width="72" height="36" rx="4"/><rect x="300" y="214" width="72" height="36" rx="4"/>
    <rect x="384" y="214" width="72" height="36" rx="4"/><rect x="468" y="214" width="72" height="36" rx="4"/>
    <rect x="552" y="214" width="72" height="36" rx="4"/>
  </g>
  <!-- block symbol on direct AI path -->
  <path d="M94 120 L94 168" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="94" cy="144" r="14" fill="#FEE2E2" stroke="#DC2626"/>
  <path d="M88 144 L100 144 M94 138 L94 150" stroke="#DC2626" stroke-width="2"/>
  <text x="120" y="148" fill="#DC2626" font-family="system-ui,sans-serif" font-size="12" font-weight="600">No direct access</text>
  <!-- allowed path from views to db -->
  <path d="M546 120 L546 168" stroke="#0d7d72" stroke-width="2"/>
  <text x="562" y="148" fill="#0d7d72" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Governed reads only</text>
</svg>
